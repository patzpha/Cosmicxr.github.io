<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Cosmic XR - Space In Your Room</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.5rem; letter-spacing: 2px; }
        p { margin: 0; font-size: 0.9rem; opacity: 0.8; }
    </style>
    <!-- Importa Three.js e os módulos necessários para WebXR e Hand Tracking -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com",
                "three/addons/": "https://unpkg.com"
            }
        }
    </script>
</head>
<body>

    <div id="info-overlay">
        <h1>COSMIC XR</h1>
        <p>Use um headset compatível (Meta Quest) para ver o espaço na sua sala com Hand Tracking.</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

        let container;
        let camera, scene, renderer;
        let earthMesh, cloudsMesh;
        let hand1, hand2;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            // 1. Configuração da Cena e Câmera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // 2. Iluminação Espacial
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            // 3. Criação do Planeta Terra (Cosmic Object)
            const earthGroup = new THREE.Group();
            earthGroup.position.set(0, 1.2, -0.6); // Posiciona o planeta na altura dos olhos e um pouco à frente
            scene.add(earthGroup);

            // Texturas básicas via CDN para simular a Terra
            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://githubusercontent.com');
            const cloudsTexture = textureLoader.load('https://githubusercontent.com');

            // Geometria da Terra
            const geometry = new THREE.SphereGeometry(0.2, 32, 32);
            const material = new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.8 });
            earthMesh = new THREE.Mesh(geometry, material);
            earthGroup.add(earthMesh);

            // Nuvens da Terra
            const cloudsMaterial = new THREE.MeshStandardMaterial({ map: cloudsTexture, transparent: true, opacity: 0.4 });
            cloudsMesh = new THREE.Mesh(geometry, cloudsMaterial);
            cloudsMesh.scale.setScalar(1.01);
            earthGroup.add(cloudsMesh);

            // 4. Configuração do WebGL Renderer para XR
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // 5. Adiciona o botão de AR com suporte a Hand Tracking
            document.body.appendChild(ARButton.createButton(renderer, {
                requiredFeatures: ['hand-tracking'],
                optionalFeatures: ['local-floor']
            }));

            // 6. Configuração dos Modelos das Mãos (Hand Tracking)
            const handModelFactory = new XRHandModelFactory();

            // Mão 1 (Esquerda)
            hand1 = renderer.xr.getHand(0);
            hand1.add(handModelFactory.createHandModel(hand1, 'mesh'));
            scene.add(hand1);

            // Mão 2 (Direita)
            hand2 = renderer.xr.getHand(1);
            hand2.add(handModelFactory.createHandModel(hand2, 'mesh'));
            scene.add(hand2);

            // Eventos para detectar gestos básicos (pode expandir para interagir com o planeta)
            hand1.addEventListener('connected', (event) => console.log('Mão esquerda conectada', event.data));
            hand2.addEventListener('connected', (event) => console.log('Mão direita conectada', event.data));

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 7. Loop de Animação compatível com XR
        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            // Rotação sutil do planeta e das nuvens (efeito cósmico)
            if (earthMesh && cloudsMesh) {
                earthMesh.rotation.y += 0.002;
                cloudsMesh.rotation.y += 0.003;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
